name: Patecni nahled rozvrhu
on:
  schedule:
    # Plánovač GitHubu běhy zpožďuje a při vytížení i ZAHAZUJE (2. 10. 2026 nespustil žádný
    # z pokusů v */15). Nejvíc vytížené jsou celé hodiny a čtvrthodiny → minuty 7, 27, 47.
    # Hodiny 7–17 UTC pokrývají celé okno skriptu 9:00–19:00 pražského času v létě i v zimě
    # (obnova 9:00–11:50, pak záchrana, pokud dnes snímek nevznikl). Pokusy mimo okno
    # skončí v prvním kroku za pár vteřin (bez instalace Puppeteeru), takže jich může být hodně.
    - cron: "7,27,47 7-17 * * 5"
  workflow_dispatch: {}     # ruční test kdykoliv

permissions:
  contents: write

concurrency:            # dva soubezne bezy by si pretahovaly push
  group: nahled
  cancel-in-progress: false

jobs:
  nahled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Časové okno (levné rozhodnutí bez instalace)
        id: okno
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/nahled-okno.mjs
      - uses: actions/setup-node@v4
        if: steps.okno.outputs.run == '1'
        with:
          node-version: 20
      - name: Instalace Puppeteeru
        if: steps.okno.outputs.run == '1'
        run: npm install puppeteer@23 --no-save
      - name: Screenshot rozvrhu na příští týden
        if: steps.okno.outputs.run == '1'
        env:
          BOT_EMAIL: ${{ secrets.NAHLED_BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.NAHLED_BOT_PASSWORD }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/nahled.mjs
      - name: Commit screenshotu (stálá adresa /nahled/rozvrh.png)
        if: steps.okno.outputs.run == '1'
        id: commit
        run: |
          if [ ! -f send_mail.txt ]; then echo "Skript nepracoval (mimo okno) — konec."; echo "made=0" >> $GITHUB_OUTPUT; exit 0; fi
          # Commit jen kdyz se snimek opravdu zmenil (index.html se meni vzdy kvuli razitku)
          if git diff --quiet -- public/nahled/rozvrh.png && git diff --quiet -- public/nahled/diag.txt && [ -n "$(git ls-files public/nahled/diag.txt)" ]; then
            echo "Rozvrh beze zmeny — necommituji."
            echo "made=0" >> $GITHUB_OUTPUT; exit 0
          fi
          git config user.name "nahled-bot"
          git config user.email "actions@github.com"
          git add public/nahled
          git commit -m "nahled: rozvrh na tyden od $(date -d 'next monday' +%d.%m.%Y)" || { echo "made=0" >> $GITHUB_OUTPUT; exit 0; }
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
          echo "made=1" >> $GITHUB_OUTPUT
          echo "mail=$(cat send_mail.txt)" >> $GITHUB_OUTPUT
      - name: Počkat na Netlify deploy
        if: steps.commit.outputs.made == '1'
        run: sleep 120
      - name: E-mail s odkazem přes GAS relay
        # E-mail jen z pravidelného pátečního běhu — ruční spuštění (testy, ladění) nikdy nemailuje
        if: steps.commit.outputs.made == '1' && steps.commit.outputs.mail == '1' && github.event_name == 'schedule'
        env:
          NAHLED_EMAIL: ${{ secrets.NAHLED_EMAIL }}
        run: |
          GAS=$(cat gas_url.txt)
          if [ -z "$GAS" ]; then echo "GAS URL nenalezena — e-mail přeskočen"; exit 0; fi
          TOK=$(cat gas_token.txt 2>/dev/null)   # přihlášení bota — relay bez něj nic nepošle
          MONDAY=$(date -d 'next monday' +%d.%m.%Y)
          LINK="https://smenyjt.netlify.app/nahled/"
          if [ -s recipients.txt ]; then RCPT=$(cat recipients.txt); else RCPT="$NAHLED_EMAIL"; fi
          for TO in $RCPT; do
            curl -s -X POST "$GAS" -H "Content-Type: text/plain" --data "{\"action\":\"sendEmail\",\"idToken\":\"$TOK\",\"data\":{\"to\":\"$TO\",\"employeeName\":\"ShiftFlow náhled\",\"changeDescription\":\"Rozvrh na týden od $MONDAY je připravený: $LINK\",\"weekLabel\":\"týden od $MONDAY\"}}"
            echo "→ $TO"
            sleep 2
          done
