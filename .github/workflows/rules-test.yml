name: Test pravidel databaze
on:
  push:
    paths: ["firestore.rules", "rules-tests/**", ".github/workflows/rules-test.yml"]
  workflow_dispatch: {}
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalace nástrojů
        run: npm install --no-save firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Testy na emulátoru
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-shiftflow "node --test --test-reporter=tap rules-tests/" | tee rules.log
      - name: Výsledek do anotací (čitelné přes API)
        if: always()
        run: |
          P=$(grep -c '^ok ' rules.log || true); F=$(grep -c '^not ok ' rules.log || true)
          echo "::notice title=Pravidla::prošlo $P, selhalo $F"
          grep '^not ok ' rules.log | while read -r l; do echo "::error title=Selhal test::$l"; done
