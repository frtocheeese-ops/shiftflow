<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>ShiftFlow</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #080818; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Sebeoprava: instalovaná PWA si občas drží starou index.html, která odkazuje na
      // asset s hashem, jenž po nasazení už neexistuje → prázdná obrazovka. Když se
      // hlavní skript nenačte, jednou se přenačteme s cache-bustem.
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t.tagName === "SCRIPT" && t.src && t.src.indexOf("/assets/") > -1) {
          if (!sessionStorage.getItem("sf_recover")) {
            sessionStorage.setItem("sf_recover", "1");
            location.replace(location.pathname + "?v=" + Date.now());
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
